import org.gradle.api.internal.tasks.userinput.UserInputHandler

plugins {
    id 'idea'
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

ext.configFile = file '../common/common-1.12.properties'

configFile.withReader {
    def prop = new Properties()
    prop.load(it)
    ext.common = new ConfigSlurper().parse prop
}

ext.releaseVersion = objects.property(String).convention(mod_version)

version = mod_version
group = modgroup

base { archivesName = modarchivename }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = common.mcp_mappings.toString().split('-')[0]
    useDependencyAccessTransformers = true
    username = 'TGstyle'
    injectedTags.put('VERSION', releaseVersion)
    injectedTags.put('MOD_ID', mod_id)
    injectedTags.put('MOD_NAME', mod_name)
    extraRunJvmArguments.addAll(
            '-Dforge.logging.console.level=debug',
            '-XX:+FlightRecorder',
            '-XX:StartFlightRecording=maxsize=512M,dumponexit=true,filename=logs/profile.jfr,settings=profile'
    )
}

tasks.named('injectTags').configure { outputClassName = "${modgroup}.Tags" }

repositories {
    maven {
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.cleanroommc.com' }
    mavenCentral()
}

configurations {
    clientRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    implementation rfg.deobf("curse.maven:${common.imme_version}")
    runtimeOnly rfg.deobf("${common.mjei_version}")

    clientRuntime rfg.deobf("curse.maven:${common.bf3r_version}")

    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    String mixinBooter = modUtils.enableMixins('zone.rong:mixinbooter:10.7', 'mixins.immersivefixes.refmap.json')
    api(mixinBooter) { transitive = false }
    annotationProcessor(mixinBooter) { transitive = false }
}

tasks.named('runClient').configure {
    extraArgs.addAll('--width', '1920', '--height', '1080')
    classpath configurations.clientRuntime
}

tasks.named('runServer').configure {
    workingDir = file('run/server')
}

processResources {
    inputs.property 'version', releaseVersion
    inputs.property 'mcversion', common.mcversion
    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand 'version': releaseVersion.get(), 'mcversion': common.mcversion,
                'mod_id': mod_id, 'mod_name': mod_name,
                'mod_authors': mod_authors, 'mod_description': mod_description, 'mod_logo': mod_logo
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('MixinConfigs': 'mixins.immersivefixes.json')
    }
}

sourceSets.configureEach { it.output.resourcesDir = it.output.classesDirs.getFiles().iterator().next() }

tasks.register('devJar', Jar) {
    dependsOn classes
    from sourceSets.main.output
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('reobfJar').configure { mustRunAfter tasks.named('devJar') }

assemble.dependsOn devJar

tasks.register('bumpVersion') {
    def inputHandler = project.services.get(UserInputHandler)
    def propertiesFile = file('gradle.properties')
    def currentVersion = mod_version
    def release = releaseVersion
    doLast {
        def choice = inputHandler.askUser { it.choice("Release type for ${currentVersion}", ['patch', 'fix']).whenNotConnected(null).ask() }.getOrNull()
        if (choice == null) { throw new GradleException('Choosing patch or fix needs an interactive console; run the build from a terminal') }
        def (major, minor, patch) = currentVersion.tokenize('.')*.toInteger()
        def next = choice == 'fix' ? "${major}.${minor + 1}.0" : "${major}.${minor}.${patch + 1}"
        propertiesFile.text = propertiesFile.text.replaceFirst(/(?m)^mod_version\s*=.*$/, "mod_version=${next}")
        release.set(next)
        logger.lifecycle("Version ${currentVersion} -> ${next} (${choice})")
    }
}

assemble.dependsOn 'bumpVersion'

tasks.withType(Jar).configureEach {
    mustRunAfter 'bumpVersion'
    archiveVersion.set(releaseVersion)
}

tasks.named('processResources').configure { mustRunAfter 'bumpVersion' }

tasks.named('injectTags').configure { mustRunAfter 'bumpVersion' }
